name: Java CI

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build
        run: ./gradlew build

      - name: Publish Checkstyle Main
        uses: reviewdog/action-checkstyle@v1
        with:
          reporter: github-pr-review
          path: build/reports/checkstyle/main.xml

      - name: Publish Checkstyle Test
        uses: reviewdog/action-checkstyle@v1
        with:
          reporter: github-pr-review
          path: build/reports/checkstyle/test.xml