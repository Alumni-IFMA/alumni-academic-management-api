name: CI/CD com Reviewdog
on: [push, pull_request]

permissions:
  pull-requests: write
  checks: write
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew build

      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1.5.0
        with:
          reviewdog_version: latest

      - name: Run Tests
        run: ./gradlew test -Pprofile=test

      - name: Run Checkstyle com Reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew checkstyleMain checkstyleTest | reviewdog \
            -f=checkstyle \
            -reporter=github-pr-review \
            -filter-mode=added \
            -level=warning \
            -fail-on-error=true
